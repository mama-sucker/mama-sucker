<svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" font-family="Courier New, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="600" height="260" rx="10"/>
    </clipPath>
  </defs>

  <style>
    /* base */
    .bg { fill: #000; }
    .rain { fill: #0f0; opacity: 0.18; font-size: 14px; }
    .scan { fill: #00ff41; opacity: 0.04; }
    .prompt { fill: #4a4a4a; font-size: 13px; }
    .cmd    { fill: #00ff41; font-size: 13px; }
    .out    { fill: #00cc33; font-size: 13px; }
    .warn   { fill: #ff2b2b; font-size: 13px; font-weight: bold; }
    .cursor { fill: #00ff41; animation: blink 1s steps(1) infinite; }

    @keyframes blink {
      0%, 50%  { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* CRT flicker over whole screen */
    .crt { animation: flicker 6s infinite; }
    @keyframes flicker {
      0%, 92%, 100% { opacity: 1; }
      93%           { opacity: 0.85; }
      94%           { opacity: 1; }
      95%           { opacity: 0.9; }
      96%           { opacity: 1; }
    }

    /* scanlines drifting down */
    .scanlines { animation: scanmove 6s linear infinite; }
    @keyframes scanmove {
      0%   { transform: translateY(0); }
      100% { transform: translateY(4px); }
    }

    /* matrix rain columns fall + loop */
    .col { animation: fall linear infinite; }
    @keyframes fall {
      0%   { transform: translateY(-260px); }
      100% { transform: translateY(260px); }
    }

    /* glitch title: chromatic aberration jitter */
    .glitchWrap { animation: glitchShift 3s infinite; }
    .gR { fill: #ff2b2b; opacity: 0.7; }
    .gB { fill: #00e5ff; opacity: 0.7; }
    .gG { fill: #00ff41; }
    @keyframes glitchShift {
      0%, 100% { transform: translate(0,0); }
      21%      { transform: translate(0,0); }
      22%      { transform: translate(-2px,0); }
      23%      { transform: translate(2px,0); }
      24%      { transform: translate(0,0); }
      60%      { transform: translate(0,0); }
      61%      { transform: translate(2px,1px); }
      62%      { transform: translate(-2px,-1px); }
      63%      { transform: translate(0,0); }
    }

    /* cycling command screens */
    .s0 { animation: fade0 14s linear infinite; }
    .s1 { animation: fade1 14s linear infinite; }
    .s2 { animation: fade2 14s linear infinite; }
    @keyframes fade0 {
      0% {opacity:0;} 2% {opacity:1;} 28% {opacity:1;} 33% {opacity:0;} 100% {opacity:0;}
    }
    @keyframes fade1 {
      0% {opacity:0;} 33% {opacity:0;} 35% {opacity:1;} 61% {opacity:1;} 66% {opacity:0;} 100% {opacity:0;}
    }
    @keyframes fade2 {
      0% {opacity:0;} 66% {opacity:0;} 68% {opacity:1;} 94% {opacity:1;} 100% {opacity:0;}
    }
  </style>

  <g clip-path="url(#frame)" class="crt">
    <rect class="bg" x="0" y="0" width="600" height="260"/>

    <!-- matrix rain background -->
    <g opacity="1">
      <text class="rain col" x="10"  y="0" style="animation-duration:7s;">0110101</text>
      <text class="rain col" x="45"  y="0" style="animation-duration:5.2s; animation-delay:-1s;">FS0C13TY</text>
      <text class="rain col" x="95"  y="0" style="animation-duration:6.4s; animation-delay:-3s;">10x7Ff3</text>
      <text class="rain col" x="150" y="0" style="animation-duration:4.8s; animation-delay:-2s;">root#4451</text>
      <text class="rain col" x="210" y="0" style="animation-duration:6.9s; animation-delay:-4s;">0xDEADBEEF</text>
      <text class="rain col" x="280" y="0" style="animation-duration:5.6s; animation-delay:-0.5s;">encrypt()</text>
      <text class="rain col" x="340" y="0" style="animation-duration:7.3s; animation-delay:-2.5s;">1c3_c0ld</text>
      <text class="rain col" x="400" y="0" style="animation-duration:5s;   animation-delay:-1.5s;">sudo su</text>
      <text class="rain col" x="460" y="0" style="animation-duration:6.1s; animation-delay:-3.5s;">payload.sh</text>
      <text class="rain col" x="520" y="0" style="animation-duration:4.5s; animation-delay:-2.8s;">no_trace</text>
      <text class="rain col" x="560" y="0" style="animation-duration:6.6s; animation-delay:-1.2s;">ghost_shell</text>
    </g>

    <!-- header bar -->
    <rect x="0" y="0" width="600" height="28" fill="#0a0a0a"/>
    <circle cx="18" cy="14" r="4" fill="#3a3a3a"/>
    <circle cx="34" cy="14" r="4" fill="#3a3a3a"/>
    <circle cx="50" cy="14" r="4" fill="#3a3a3a"/>

    <g class="glitchWrap">
      <text x="300" y="18" text-anchor="middle" class="gR" font-size="13">ROOT ACCESS // SESSION ACTIVE</text>
      <text x="300" y="18" text-anchor="middle" class="gB" font-size="13">ROOT ACCESS // SESSION ACTIVE</text>
      <text x="300" y="18" text-anchor="middle" class="gG" font-size="13">ROOT ACCESS // SESSION ACTIVE</text>
    </g>

    <!-- cycling terminal screens -->
    <g class="s0">
      <text x="18" y="70"><tspan class="prompt">anonymous@roy:~$ </tspan><tspan class="cmd">ssh target -p 31337</tspan></text>
      <text x="18" y="92" class="out">connection established...</text>
      <text x="18" y="112" class="out">encryption: AES-256, handshake OK</text>
    </g>

    <g class="s1">
      <text x="18" y="70"><tspan class="prompt">root@ghost:~$ </tspan><tspan class="cmd">./decrypt_payload.sh</tspan></text>
      <text x="18" y="92" class="out">[OK] payload decrypted</text>
      <text x="18" y="112" class="out">[OK] signature verified</text>
      <text x="18" y="132" class="out">[OK] no logs found</text>
    </g>

    <g class="s2">
      <text x="18" y="70"><tspan class="prompt">root@ghost:~$ </tspan><tspan class="cmd">echo $TRACE_STATUS</tspan></text>
      <text x="18" y="92" class="warn">UNTRACEABLE</text>
      <text x="18" y="112" class="out">connection closed cleanly</text>
    </g>

    <rect x="18" y="148" width="9" height="14" class="cursor"/>

    <!-- scanline texture -->
    <g class="scanlines">
      <rect class="scan" x="0" y="0"   width="600" height="1"/>
      <rect class="scan" x="0" y="4"   width="600" height="1"/>
      <rect class="scan" x="0" y="8"   width="600" height="1"/>
      <rect class="scan" x="0" y="12"  width="600" height="1"/>
      <rect class="scan" x="0" y="16"  width="600" height="1"/>
      <rect class="scan" x="0" y="20"  width="600" height="1"/>
      <rect class="scan" x="0" y="24"  width="600" height="1"/>
      <rect class="scan" x="0" y="28"  width="600" height="1"/>
      <rect class="scan" x="0" y="32"  width="600" height="1"/>
      <rect class="scan" x="0" y="36"  width="600" height="1"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="599" height="259" rx="10" fill="none" stroke="#1a1a1a"/>
</svg>
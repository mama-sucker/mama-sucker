<svg viewBox="0 0 600 210" xmlns="http://www.w3.org/2000/svg" font-family="Courier New, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .prompt { fill: #6e7681; font-size: 13px; }
    .cmd    { fill: #7ee787; font-size: 13px; }
    .out    { fill: #8b949e; font-size: 13px; }
    .flag   { fill: #3fb950; font-size: 13px; font-weight: bold; }
    .title  { fill: #71717a; font-size: 11px; }

    .cursor {
      fill: #7ee787;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink {
      0%, 50%  { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .s0 { animation: fade0 16s linear infinite; }
    .s1 { animation: fade1 16s linear infinite; }
    .s2 { animation: fade2 16s linear infinite; }
    .s3 { animation: fade3 16s linear infinite; }

    @keyframes fade0 {
      0%      { opacity: 0; }
      1.875%  { opacity: 1; }
      21.875% { opacity: 1; }
      25%     { opacity: 0; }
      100%    { opacity: 0; }
    }
    @keyframes fade1 {
      0%      { opacity: 0; }
      25%     { opacity: 0; }
      26.875% { opacity: 1; }
      46.875% { opacity: 1; }
      50%     { opacity: 0; }
      100%    { opacity: 0; }
    }
    @keyframes fade2 {
      0%      { opacity: 0; }
      50%     { opacity: 0; }
      51.875% { opacity: 1; }
      71.875% { opacity: 1; }
      75%     { opacity: 0; }
      100%    { opacity: 0; }
    }
    @keyframes fade3 {
      0%      { opacity: 0; }
      75%     { opacity: 0; }
      76.875% { opacity: 1; }
      96.875% { opacity: 1; }
      100%    { opacity: 0; }
    }
  </style>

  <!-- Terminal window -->
  <rect x="0" y="0" width="600" height="210" rx="10" fill="#0d1117" stroke="#1e1e24"/>
  <rect x="0" y="0" width="600" height="30" rx="10" fill="#1e1e24"/>
  <circle cx="20" cy="15" r="5" fill="#ff5f57"/>
  <circle cx="40" cy="15" r="5" fill="#febc2e"/>
  <circle cx="60" cy="15" r="5" fill="#28c840"/>
  <text x="76" y="19" class="title">addison@homelab ~</text>

  <!-- Screen 0: whoami -->
  <g class="s0">
    <text x="18" y="58"><tspan class="prompt">addison@homelab:~$ </tspan><tspan class="cmd">whoami</tspan></text>
    <text x="18" y="80" class="out">cybersecurity student @ USF | homelab operator | AI tinkerer</text>
  </g>

  <!-- Screen 1: nmap -->
  <g class="s1">
    <text x="18" y="58"><tspan class="prompt">addison@homelab:~$ </tspan><tspan class="cmd">nmap -sV homelab.local</tspan></text>
    <text x="18" y="80"  class="out">PORT      STATE  SERVICE</text>
    <text x="18" y="98"  class="out">443/tcp   open   nginx/1.24</text>
    <text x="18" y="116" class="out">8080/tcp  open   python-flask</text>
    <text x="18" y="134" class="out">5000/tcp  open   vLLM (CUDA 12.4)</text>
  </g>

  <!-- Screen 2: exploit.py -->
  <g class="s2">
    <text x="18" y="58"><tspan class="prompt">addison@homelab:~$ </tspan><tspan class="cmd">python3 exploit.py</tspan></text>
    <text x="18" y="80"  class="out">[+] Target: 192.168.1.10</text>
    <text x="18" y="98"  class="out">[+] Found: CVE-2024-1337</text>
    <text x="18" y="116" class="out">[+] Shell received!</text>
  </g>

  <!-- Screen 3: flag -->
  <g class="s3">
    <text x="18" y="58"><tspan class="prompt">addison@homelab:~$ </tspan><tspan class="cmd">cat /root/flag.txt</tspan></text>
    <text x="18" y="80" class="flag">FLAG: HERMES{g00d_job_cyber_kid}</text>
  </g>

  <!-- Blinking cursor, fixed bottom-left -->
  <rect x="18" y="182" width="9" height="14" class="cursor"/>
</svg>
